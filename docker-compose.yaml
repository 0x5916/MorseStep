services:
  db:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_PATH:-./data/postgres}
        target: /var/lib/postgresql
        bind:
          create_host_path: true
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=1536MB
      -c effective_cache_size=4608MB
      -c maintenance_work_mem=384MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=15123kB
      -c huge_pages=off
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c max_parallel_maintenance_workers=2
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      READ_TIMEOUT: ${READ_TIMEOUT:-15s}
      READ_HEADER_TIMEOUT: ${READ_HEADER_TIMEOUT:-5s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-30s}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-120s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol ${CLOUDFLARED_PROTOCOL:-quic} run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      - backend
      - frontend
      - pgadmin

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE: ${PUBLIC_API_BASE}
    restart: unless-stopped
    ports:
      - "3000:80"

  # One-shot renderer: turns the credentials in .env into pgAdmin's server definition and
  # .pgpass, then exits. Runs before pgadmin on every `docker compose up -d`.
  pgadmin-config:
    image: dpage/pgadmin4:9.18.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
    command:
      - |
        set -eu

        if [ -z "$$PGADMIN_DEFAULT_EMAIL" ]; then
          echo "pgadmin-config: PGADMIN_DEFAULT_EMAIL is not set; fill it in .env (see example.env)." >&2
          exit 1
        fi

        if [ -z "$$DB_USER" ] || [ -z "$$DB_NAME" ] || [ -z "$$DB_PASSWORD" ]; then
          echo "pgadmin-config: database credentials are not set; fill them in .env (see example.env)." >&2
          exit 1
        fi

        # pgAdmin keeps a per-login storage directory; @ in the login email becomes _.
        storage_dir="/var/lib/pgadmin/storage/$$(printf '%s' "$$PGADMIN_DEFAULT_EMAIL" | tr '@' '_')"
        mkdir -p "$$storage_dir"

        cat > /var/lib/pgadmin/servers.json <<EOF
        {
          "Servers": {
            "1": {
              "Name": "OpenCW",
              "Group": "Servers",
              "Host": "db",
              "Port": 5432,
              "Username": "$$DB_USER",
              "MaintenanceDB": "$$DB_NAME",
              "ConnectionParameters": {
                "sslmode": "prefer"
              }
            }
          }
        }
        EOF

        # libpq matches .pgpass on host:port:database:username:password, so : and \ must be escaped.
        printf 'db:5432:%s:%s:%s\n' "$$DB_NAME" "$$DB_USER" "$$(printf '%s' "$$DB_PASSWORD" | sed 's/[\\:]/\\&/g')" > "$$storage_dir/.pgpass"
        chmod 600 "$$storage_dir/.pgpass"

        echo "pgadmin-config: rendered servers.json and $$storage_dir/.pgpass"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pgadmin-config:
        condition: service_completed_successfully
    ports:
      # Loopback only. Public access is through the Cloudflare tunnel at
      # https://pgadmin.opencw.net, guarded by a Zero Trust Access policy.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test:
        - CMD-SHELL
        - /venv/bin/python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:80/misc/ping')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgadmin_data:
